version: "3.9"

services:
  # ── PostgreSQL database ───────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pristav}
      POSTGRES_USER: ${POSTGRES_USER:-pristav}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - pristav
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pristav} -d ${POSTGRES_DB:-pristav}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ── PostgreSQL daily backup ───────────────────────────────────────────────────
  # Runs pg_dump daily at 02:30 and retains the last 7 backups.
  pg-backup:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pristav}
      POSTGRES_USER: ${POSTGRES_USER:-pristav}
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_HOST: postgres
    volumes:
      - pg_backups:/backups
    networks:
      - pristav
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: >
      sh -c '
        echo "pg-backup: starting crond";
        mkdir -p /backups;
        # Write crontab for daily backup at 02:30
        echo "30 2 * * * pg_dump -h postgres -U $$POSTGRES_USER $$POSTGRES_DB | gzip > /backups/pristav-\$$(date +\\%Y\\%m\\%d-\\%H\\%M\\%S).sql.gz && ls -t /backups/*.sql.gz | tail -n +8 | xargs -r rm --" > /var/spool/cron/crontabs/root;
        crond -f -l 8
      '

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3001"
      # DATABASE_URL takes priority over DATABASE_PATH (SQLite).
      # Set DATABASE_URL to use PostgreSQL; leave unset to fall back to SQLite.
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-pristav}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-pristav}}
      DATABASE_PATH: /app/data/pristav.db
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMSAPI_TOKEN: ${SMSAPI_TOKEN:-}
      SMSAPI_SENDER: ${SMSAPI_SENDER:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:admin@pristav-radosti.cz}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      REMINDER_HOURS: ${REMINDER_HOURS:-24}
      FIO_API_KEY: ${FIO_API_KEY:-}
    volumes:
      - api_data:/app/data
    networks:
      - pristav
    expose:
      - "3001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        API_INTERNAL_URL: ${API_INTERNAL_URL:-http://api:3001}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      API_INTERNAL_URL: ${API_INTERNAL_URL:-http://api:3001}
    networks:
      - pristav
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      api:
        condition: service_healthy
      postgres:
        condition: service_healthy

  nginx:
    image: nginx:1.25-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    networks:
      - pristav
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy

  # ── Certbot — Let's Encrypt SSL certificate renewal ──────────────────────────
  # Usage:
  #   docker compose run --rm certbot certonly --webroot \
  #     -w /var/www/certbot -d pristav-radosti.cz --email admin@pristav-radosti.cz \
  #     --agree-tos --non-interactive
  # Renewal (add to host cron — runs every 12h, only renews if <30 days left):
  #   0 */12 * * * docker compose -f /opt/pristav/docker-compose.yml run --rm certbot renew --quiet
  certbot:
    image: certbot/certbot:latest
    restart: "no"
    volumes:
      - certbot_conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    profiles:
      - certbot

volumes:
  pg_data:
  pg_backups:
  api_data:
  certbot_conf:
  certbot_www:

networks:
  pristav:
    driver: bridge
