name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: pristav-radosti-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm -C packages/shared build

      - name: Lint
        run: pnpm -r lint

      - name: Unit + integration tests
        run: pnpm -r test

      - name: Build
        env:
          NEXT_PUBLIC_API_URL: http://127.0.0.1:3001
        run: pnpm -r build

# E2E / Playwright testy se NEspouští v CI.
# Testy provádí PROGRAMMER a jeho agenti lokálně před každým deployem.
