name: Deploy Smoke Verify

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: Public base URL of the deployed web app
        required: true
        type: string
      api_url:
        description: Optional API URL override (defaults to <base_url>/api)
        required: false
        type: string
      expected_version:
        description: Optional expected API version (e.g. 2.11.0)
        required: false
        type: string
      allow_http:
        description: Allow HTTP (useful only for internal staging)
        required: false
        default: false
        type: boolean

jobs:
  smoke:
    name: Public deploy smoke verification
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      BASE_URL: ${{ inputs.base_url }}
      API_URL: ${{ inputs.api_url }}
      EXPECTED_VERSION: ${{ inputs.expected_version }}
      ADMIN_EMAIL: ${{ secrets.SMOKE_ADMIN_EMAIL }}
      ADMIN_PASSWORD: ${{ secrets.SMOKE_ADMIN_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate required secrets
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${ADMIN_EMAIL:-}" || -z "${ADMIN_PASSWORD:-}" ]]; then
            echo "Missing GitHub Actions secrets: SMOKE_ADMIN_EMAIL and/or SMOKE_ADMIN_PASSWORD" >&2
            echo "Add them in repo or environment secrets before running this workflow." >&2
            exit 1
          fi

      - name: Run smoke verification
        shell: bash
        run: |
          set -euo pipefail
          CMD=(pnpm --silent smoke:verify -- --base-url="$BASE_URL" --json)

          if [[ -n "${API_URL:-}" ]]; then
            CMD+=(--api-url="$API_URL")
          fi

          if [[ -n "${EXPECTED_VERSION:-}" ]]; then
            CMD+=(--expected-version="$EXPECTED_VERSION")
          fi

          if [[ "${{ inputs.allow_http }}" == "true" ]]; then
            CMD+=(--allow-http)
          fi

          "${CMD[@]}" | tee smoke-summary.json

      - name: Print smoke summary
        run: |
          node -e 'const fs=require("fs"); const s=JSON.parse(fs.readFileSync("smoke-summary.json","utf8")); console.log(`Smoke result: ${s.ok ? "PASS" : "FAIL"}`); for (const c of s.checks ?? []) console.log(`${c.ok ? "✅" : "❌"} ${c.name}: ${c.details}`);'

      - name: Upload smoke summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-summary
          path: smoke-summary.json
          if-no-files-found: error
