# Staging override — HTTP-only (no SSL)
# Usage: docker compose -f docker-compose.yml -f docker-compose.staging.yml up -d

services:
  nginx:
    volumes:
      - ./nginx/nginx-staging.conf:/etc/nginx/nginx.conf:ro

  api:
    environment:
      COOKIE_SECURE: "false"
      # Force SQLite mode in staging — PostgreSQL schema is not set up for this deployment
      # Unset DATABASE_URL so the API falls back to file-based SQLite (DATABASE_PATH)
      DATABASE_URL: ""
