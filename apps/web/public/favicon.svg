<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2A3570"/>
      <stop offset="100%" stop-color="#1A2050"/>
    </linearGradient>
    <!-- Lighthouse body gradient -->
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#E8EAF0"/>
      <stop offset="50%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#D0D4E0"/>
    </linearGradient>
    <!-- Lamp glow -->
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FBBF24" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#FBBF24" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#FBBF24" stop-opacity="0"/>
    </radialGradient>
    <!-- Light beam gradient -->
    <linearGradient id="beam-l" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FBBF24" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#FBBF24" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="beam-r" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FBBF24" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#FBBF24" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Rounded square background -->
  <rect width="32" height="32" rx="7" ry="7" fill="url(#bg)"/>

  <!-- Light beams -->
  <polygon points="16,9 4,3 8,1" fill="url(#beam-l)"/>
  <polygon points="16,9 28,3 24,1" fill="url(#beam-r)"/>
  <polygon points="16,9 3,14 6,12" fill="url(#beam-l)"/>
  <polygon points="16,9 29,14 26,12" fill="url(#beam-r)"/>

  <!-- Radial glow behind lamp -->
  <circle cx="16" cy="9" r="6" fill="url(#glow)"/>

  <!-- Lighthouse base platform -->
  <rect x="9" y="26" width="14" height="2.5" rx="0.8" fill="#C8CCE0"/>

  <!-- Lighthouse body (tapered) -->
  <polygon points="13.5,10 18.5,10 20.5,26 11.5,26" fill="url(#body)"/>

  <!-- Orange stripe -->
  <polygon points="14.5,16 17.5,16 17.8,18 14.2,18" fill="#E86A24"/>

  <!-- Upper white stripe border -->
  <polygon points="14.2,18 17.8,18 18,19 14,19" fill="#D0D4E0" opacity="0.5"/>

  <!-- Lamp housing -->
  <rect x="13" y="7.5" width="6" height="3.5" rx="0.8" fill="#D0D4E0"/>
  <rect x="13.5" y="8" width="5" height="2.5" rx="0.5" fill="#FBBF24"/>

  <!-- Lamp glass panes (vertical lines) -->
  <line x1="14.8" y1="8" x2="14.8" y2="10.5" stroke="#E86A24" stroke-width="0.3" opacity="0.5"/>
  <line x1="16" y1="8" x2="16" y2="10.5" stroke="#E86A24" stroke-width="0.3" opacity="0.5"/>
  <line x1="17.2" y1="8" x2="17.2" y2="10.5" stroke="#E86A24" stroke-width="0.3" opacity="0.5"/>

  <!-- Lamp dome/cap -->
  <path d="M13.5,7.5 L16,5.5 L18.5,7.5 Z" fill="#C8CCE0"/>

  <!-- Small finial on top -->
  <circle cx="16" cy="5.2" r="0.6" fill="#FBBF24"/>

  <!-- Water line at bottom -->
  <path d="M2,28 Q5,27 8,28 Q11,29 14,28 Q17,27 20,28 Q23,29 26,28 Q29,27 30,28" 
        fill="none" stroke="#4A5690" stroke-width="0.8" opacity="0.6"/>
</svg>
