<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Rounded coral background -->
  <rect width="32" height="32" rx="6" ry="6" fill="#F97316"/>

  <!-- Lighthouse body — trapezoid (wider at base, narrower at top) -->
  <polygon points="13,8 19,8 21,25 11,25" fill="white"/>

  <!-- Light housing — small rectangle on top -->
  <rect x="12" y="5" width="8" height="4" rx="1" fill="white"/>

  <!-- Light beam — small circle -->
  <circle cx="16" cy="7" r="1.5" fill="#F97316"/>

  <!-- Base platform -->
  <rect x="9" y="25" width="14" height="3" rx="1" fill="white"/>
</svg>
