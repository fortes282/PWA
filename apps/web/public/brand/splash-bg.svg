<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 800">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFBF5"/>
      <stop offset="60%" stop-color="#FFFBF5"/>
      <stop offset="100%" stop-color="#FFF0E0"/>
    </linearGradient>
    <linearGradient id="wave1-grad" x1="0" y1="0" x2="1" y2="0.3">
      <stop offset="0%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#FB923C"/>
    </linearGradient>
    <linearGradient id="wave2-grad" x1="0" y1="0" x2="1" y2="0.2">
      <stop offset="0%" stop-color="#FB923C"/>
      <stop offset="100%" stop-color="#FDBA74"/>
    </linearGradient>
    <linearGradient id="wave3-grad" x1="0" y1="0" x2="0.8" y2="0.4">
      <stop offset="0%" stop-color="#FDBA74"/>
      <stop offset="100%" stop-color="#FED7AA"/>
    </linearGradient>
    <linearGradient id="harbor-grad" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#1E3A5F" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#1E3A5F" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="sun-glow" cx="200" cy="180" r="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FBBF24" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#FBBF24" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="800" fill="url(#sky)"/>

  <!-- Subtle sun glow -->
  <circle cx="200" cy="180" r="120" fill="url(#sun-glow)"/>

  <!-- Harbor silhouette at top - subtle -->
  <g opacity="0.08" fill="#1E3A5F">
    <!-- Distant lighthouse silhouette -->
    <rect x="185" y="80" width="12" height="60" rx="1"/>
    <polygon points="180,80 191,60 202,80"/>
    <circle cx="191" cy="62" r="5"/>

    <!-- Dock structures -->
    <rect x="120" y="130" width="60" height="10" rx="1"/>
    <rect x="130" y="120" width="6" height="20"/>
    <rect x="160" y="115" width="6" height="25"/>

    <rect x="220" y="125" width="70" height="10" rx="1"/>
    <rect x="240" y="110" width="6" height="25"/>
    <rect x="270" y="115" width="6" height="20"/>

    <!-- Small boat shapes -->
    <path d="M100,138 Q110,128 120,138 Z"/>
    <path d="M300,133 Q310,123 320,133 Z"/>
  </g>

  <!-- Decorative dots/stars -->
  <circle cx="80" cy="200" r="2" fill="#FBBF24" opacity="0.3"/>
  <circle cx="320" cy="160" r="1.5" fill="#FBBF24" opacity="0.25"/>
  <circle cx="150" cy="240" r="1.5" fill="#F97316" opacity="0.15"/>
  <circle cx="340" cy="280" r="2" fill="#FBBF24" opacity="0.2"/>
  <circle cx="60" cy="300" r="1.5" fill="#5EEAD4" opacity="0.2"/>

  <!-- Wave layer 3 (back, lightest) -->
  <path d="M-20,680 C40,640 100,700 160,670 C220,640 280,700 340,660 C380,640 420,680 420,680 L420,800 L-20,800 Z" fill="url(#wave3-grad)" opacity="0.5"/>

  <!-- Wave layer 2 (middle) -->
  <path d="M-20,710 C50,680 100,730 170,700 C240,670 300,720 360,695 C400,680 420,710 420,710 L420,800 L-20,800 Z" fill="url(#wave2-grad)" opacity="0.6"/>

  <!-- Wave layer 1 (front, darkest) -->
  <path d="M-20,740 C40,720 90,750 160,730 C230,710 290,750 350,725 C390,712 420,740 420,740 L420,800 L-20,800 Z" fill="url(#wave1-grad)" opacity="0.75"/>

  <!-- Foam highlights on front wave -->
  <path d="M0,738 C30,728 60,740 90,732 C120,724 150,736 180,730" fill="none" stroke="white" stroke-width="1" opacity="0.3" stroke-linecap="round"/>
  <path d="M220,722 C250,716 280,726 310,718 C340,712 370,722 400,716" fill="none" stroke="white" stroke-width="1" opacity="0.25" stroke-linecap="round"/>
</svg>
