<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 160">
  <defs>
    <linearGradient id="mc-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3B4279"/>
      <stop offset="100%" stop-color="#242B61"/>
    </linearGradient>
    <radialGradient id="mc-glow" cx="60" cy="14" r="30" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FBBF24" stop-opacity="0.6"/>
      <stop offset="40%" stop-color="#E86A24" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#E86A24" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mc-stripe" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E86A24"/>
      <stop offset="100%" stop-color="#E8874A"/>
    </linearGradient>
  </defs>

  <!-- Shadow (smaller, mascot is excited/jumping) -->
  <ellipse cx="62" cy="152" rx="24" ry="4" fill="#242B61" opacity="0.06"/>

  <!-- Bigger warm glow behind lamp (celebrating!) -->
  <circle cx="60" cy="14" r="28" fill="url(#mc-glow)"/>

  <!-- Extra glow rays -->
  <g stroke="#FBBF24" stroke-width="1.5" stroke-linecap="round" opacity="0.35">
    <line x1="60" y1="-2" x2="60" y2="-10"/>
    <line x1="75" y1="2" x2="82" y2="-4"/>
    <line x1="45" y1="2" x2="38" y2="-4"/>
    <line x1="80" y1="14" x2="88" y2="12"/>
    <line x1="40" y1="14" x2="32" y2="12"/>
  </g>

  <!-- Lamp light (bigger) -->
  <circle cx="60" cy="16" r="10" fill="#FBBF24"/>
  <circle cx="60" cy="16" r="6" fill="#FDE68A"/>
  <circle cx="57" cy="13" r="2.5" fill="white" opacity="0.5"/>

  <!-- Lighthouse cap -->
  <polygon points="44,33 60,16 76,33" fill="#242B61"/>

  <!-- Lighthouse body -->
  <rect x="42" y="33" width="36" height="80" rx="4" fill="url(#mc-body)"/>

  <!-- Stripes -->
  <rect x="42" y="53" width="36" height="7" rx="1" fill="url(#mc-stripe)" opacity="0.85"/>
  <rect x="42" y="80" width="36" height="7" rx="1" fill="url(#mc-stripe)" opacity="0.85"/>

  <!-- Window/belly -->
  <rect x="52" y="40" width="16" height="10" rx="3" fill="#FBBF24" opacity="0.8"/>

  <!-- Face - excited/celebrating -->
  <!-- Eyes (happy squint ^_^) -->
  <path d="M48,67 Q52,63 56,67" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M64,67 Q68,63 72,67" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Rosy cheeks (brighter when celebrating) -->
  <circle cx="46" cy="73" r="4" fill="#E86A24" opacity="0.22"/>
  <circle cx="74" cy="73" r="4" fill="#E86A24" opacity="0.22"/>

  <!-- Big open smile -->
  <path d="M50,75 Q60,88 70,75" fill="#F8F9FF" stroke="#F8F9FF" stroke-width="1" stroke-linecap="round"/>
  <!-- Tongue -->
  <path d="M55,80 Q60,85 65,80" fill="#E86A24" opacity="0.5"/>

  <!-- Left arm RAISED UP -->
  <path d="M42,60 C28,52 18,38 16,30" fill="none" stroke="#242B61" stroke-width="5" stroke-linecap="round"/>
  <circle cx="15" cy="29" r="5" fill="#FBBF24"/>

  <!-- Right arm RAISED UP -->
  <path d="M78,60 C92,52 102,38 104,30" fill="none" stroke="#242B61" stroke-width="5" stroke-linecap="round"/>
  <circle cx="105" cy="29" r="5" fill="#FBBF24"/>

  <!-- Door / feet area -->
  <rect x="52" y="98" width="16" height="15" rx="8" fill="#0D144B"/>

  <!-- Feet (slightly apart - excited stance) -->
  <ellipse cx="48" cy="116" rx="10" ry="5" fill="#242B61"/>
  <ellipse cx="72" cy="116" rx="10" ry="5" fill="#242B61"/>
  <ellipse cx="46" cy="115" rx="5" ry="2" fill="#3B4279"/>
  <ellipse cx="70" cy="115" rx="5" ry="2" fill="#3B4279"/>

  <!-- Sparkles around (celebration!) -->
  <!-- Big sparkle top-left -->
  <g transform="translate(10, 18)">
    <line x1="0" y1="-6" x2="0" y2="6" stroke="#FBBF24" stroke-width="2" stroke-linecap="round"/>
    <line x1="-6" y1="0" x2="6" y2="0" stroke="#FBBF24" stroke-width="2" stroke-linecap="round"/>
    <line x1="-4" y1="-4" x2="4" y2="4" stroke="#FBBF24" stroke-width="1.2" stroke-linecap="round" opacity="0.5"/>
    <line x1="4" y1="-4" x2="-4" y2="4" stroke="#FBBF24" stroke-width="1.2" stroke-linecap="round" opacity="0.5"/>
  </g>

  <!-- Big sparkle top-right -->
  <g transform="translate(112, 15)">
    <line x1="0" y1="-5" x2="0" y2="5" stroke="#E86A24" stroke-width="2" stroke-linecap="round"/>
    <line x1="-5" y1="0" x2="5" y2="0" stroke="#E86A24" stroke-width="2" stroke-linecap="round"/>
    <line x1="-3.5" y1="-3.5" x2="3.5" y2="3.5" stroke="#E86A24" stroke-width="1.2" stroke-linecap="round" opacity="0.5"/>
    <line x1="3.5" y1="-3.5" x2="-3.5" y2="3.5" stroke="#E86A24" stroke-width="1.2" stroke-linecap="round" opacity="0.5"/>
  </g>

  <!-- Medium sparkle left -->
  <g transform="translate(8, 55)">
    <line x1="0" y1="-4" x2="0" y2="4" stroke="#5EEAD4" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="-4" y1="0" x2="4" y2="0" stroke="#5EEAD4" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Medium sparkle right -->
  <g transform="translate(114, 52)">
    <line x1="0" y1="-4" x2="0" y2="4" stroke="#5EEAD4" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="-4" y1="0" x2="4" y2="0" stroke="#5EEAD4" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Confetti dots -->
  <circle cx="5" cy="40" r="2.5" fill="#E86A24" opacity="0.4"/>
  <circle cx="115" cy="38" r="2" fill="#FBBF24" opacity="0.45"/>
  <circle cx="20" cy="95" r="2" fill="#5EEAD4" opacity="0.35"/>
  <circle cx="102" cy="90" r="2.5" fill="#5EEAD4" opacity="0.3"/>
  <circle cx="12" cy="72" r="1.5" fill="#FBBF24" opacity="0.4"/>
  <circle cx="108" cy="70" r="1.5" fill="#E86A24" opacity="0.35"/>
  <circle cx="25" cy="125" r="2" fill="#D1FAE5" opacity="0.3"/>
  <circle cx="95" cy="128" r="2" fill="#D1FAE5" opacity="0.3"/>

  <!-- Tiny stars near hands -->
  <path d="M8,24 L9,27 L12,27 L10,29 L10.5,32 L8,30 L5.5,32 L6,29 L4,27 L7,27 Z" fill="#FBBF24" opacity="0.5" transform="scale(0.8)"/>
  <path d="M108,22 L109,25 L112,25 L110,27 L110.5,30 L108,28 L105.5,30 L106,27 L104,25 L107,25 Z" fill="#E86A24" opacity="0.5"/>
</svg>
