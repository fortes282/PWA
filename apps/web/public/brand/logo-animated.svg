<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <defs>
    <radialGradient id="glow" cx="60" cy="28" r="35" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E86A24" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#E86A24" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lighthouse-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2A4F7A"/>
      <stop offset="100%" stop-color="#1E3A5F"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5EEAD4"/>
      <stop offset="100%" stop-color="#5EEAD4" stop-opacity="0.6"/>
    </linearGradient>
  </defs>

  <!-- Warm glow behind lighthouse top -->
  <circle cx="60" cy="28" r="30" fill="url(#glow)">
    <animate attributeName="r" values="28;32;28" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.8;1;0.8" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- Light rays -->
  <g opacity="0.5">
    <line x1="60" y1="28" x2="30" y2="10" stroke="#E86A24" stroke-width="1.5" stroke-linecap="round" opacity="0.4">
      <animate attributeName="opacity" values="0.2;0.5;0.2" dur="2.5s" repeatCount="indefinite"/>
    </line>
    <line x1="60" y1="28" x2="90" y2="10" stroke="#E86A24" stroke-width="1.5" stroke-linecap="round" opacity="0.4">
      <animate attributeName="opacity" values="0.2;0.5;0.2" dur="2.5s" repeatCount="indefinite" begin="0.3s"/>
    </line>
    <line x1="60" y1="28" x2="25" y2="25" stroke="#E86A24" stroke-width="1.2" stroke-linecap="round" opacity="0.3">
      <animate attributeName="opacity" values="0.15;0.4;0.15" dur="2.8s" repeatCount="indefinite" begin="0.6s"/>
    </line>
    <line x1="60" y1="28" x2="95" y2="25" stroke="#E86A24" stroke-width="1.2" stroke-linecap="round" opacity="0.3">
      <animate attributeName="opacity" values="0.15;0.4;0.15" dur="2.8s" repeatCount="indefinite" begin="0.9s"/>
    </line>
  </g>

  <!-- Lighthouse lamp -->
  <circle cx="60" cy="28" r="6" fill="#FBBF24">
    <animate attributeName="r" values="5.5;6.5;5.5" dur="2s" repeatCount="indefinite"/>
  </circle>

  <!-- Lighthouse top cap -->
  <polygon points="50,32 60,20 70,32" fill="#1E3A5F"/>

  <!-- Lighthouse body -->
  <rect x="48" y="32" width="24" height="50" rx="2" fill="url(#lighthouse-body)"/>

  <!-- Lighthouse stripes -->
  <rect x="48" y="44" width="24" height="5" fill="#E86A24" opacity="0.8"/>
  <rect x="48" y="58" width="24" height="5" fill="#E86A24" opacity="0.8"/>

  <!-- Lighthouse window -->
  <rect x="55" y="36" width="10" height="6" rx="1" fill="#FBBF24" opacity="0.9"/>

  <!-- Lighthouse door -->
  <rect x="55" y="70" width="10" height="12" rx="5" fill="#0F2744"/>

  <!-- Base platform -->
  <rect x="40" y="82" width="40" height="6" rx="2" fill="#1E3A5F"/>

  <!-- Water waves -->
  <path d="M10,95 Q25,89 40,95 Q55,101 70,95 Q85,89 100,95 L110,95" fill="none" stroke="url(#water)" stroke-width="3" stroke-linecap="round">
    <animate attributeName="d" values="M10,95 Q25,89 40,95 Q55,101 70,95 Q85,89 100,95 L110,95;M10,95 Q25,101 40,95 Q55,89 70,95 Q85,101 100,95 L110,95;M10,95 Q25,89 40,95 Q55,101 70,95 Q85,89 100,95 L110,95" dur="4s" repeatCount="indefinite"/>
  </path>
  <path d="M5,102 Q20,96 35,102 Q50,108 65,102 Q80,96 95,102 Q110,108 115,102" fill="none" stroke="#5EEAD4" stroke-width="2.5" stroke-linecap="round" opacity="0.6">
    <animate attributeName="d" values="M5,102 Q20,96 35,102 Q50,108 65,102 Q80,96 95,102 Q110,108 115,102;M5,102 Q20,108 35,102 Q50,96 65,102 Q80,108 95,102 Q110,96 115,102;M5,102 Q20,96 35,102 Q50,108 65,102 Q80,96 95,102 Q110,108 115,102" dur="4.5s" repeatCount="indefinite"/>
  </path>
  <path d="M0,109 Q18,104 36,109 Q54,114 72,109 Q90,104 108,109 L120,109" fill="none" stroke="#5EEAD4" stroke-width="2" stroke-linecap="round" opacity="0.35">
    <animate attributeName="d" values="M0,109 Q18,104 36,109 Q54,114 72,109 Q90,104 108,109 L120,109;M0,109 Q18,114 36,109 Q54,104 72,109 Q90,114 108,109 L120,109;M0,109 Q18,104 36,109 Q54,114 72,109 Q90,104 108,109 L120,109" dur="5s" repeatCount="indefinite"/>
  </path>
</svg>
