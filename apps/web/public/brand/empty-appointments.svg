<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="cal-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFBF5"/>
      <stop offset="100%" stop-color="#FFF5EB"/>
    </linearGradient>
    <linearGradient id="cal-header" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#FB923C"/>
    </linearGradient>
  </defs>

  <!-- Small wave decorations at bottom -->
  <path d="M20,175 Q45,168 70,175 Q95,182 120,175 Q145,168 170,175 Q185,180 195,175" fill="none" stroke="#5EEAD4" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
  <path d="M10,185 Q35,178 60,185 Q85,192 110,185 Q135,178 160,185 Q180,190 200,185" fill="none" stroke="#5EEAD4" stroke-width="1.5" stroke-linecap="round" opacity="0.25"/>

  <!-- Small anchor decoration - left -->
  <g transform="translate(30, 145)" opacity="0.15" fill="#1E3A5F">
    <circle cx="8" cy="2" r="2.5" fill="none" stroke="#1E3A5F" stroke-width="1.5"/>
    <line x1="8" y1="4" x2="8" y2="18" stroke="#1E3A5F" stroke-width="1.5"/>
    <path d="M2,14 Q8,20 14,14" fill="none" stroke="#1E3A5F" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Small lighthouse decoration - right -->
  <g transform="translate(158, 138)" opacity="0.12" fill="#1E3A5F">
    <rect x="4" y="8" width="8" height="20" rx="1"/>
    <polygon points="2,8 8,0 14,8"/>
    <circle cx="8" cy="2" r="3" fill="#FBBF24" opacity="0.5"/>
  </g>

  <!-- Calendar shadow -->
  <rect x="48" y="38" width="108" height="118" rx="12" fill="#1E3A5F" opacity="0.06"/>

  <!-- Calendar body -->
  <rect x="45" y="35" width="108" height="118" rx="12" fill="url(#cal-body)" stroke="#F97316" stroke-width="1.5" stroke-opacity="0.3"/>

  <!-- Calendar header -->
  <rect x="45" y="35" width="108" height="30" rx="12" fill="url(#cal-header)"/>
  <rect x="45" y="53" width="108" height="12" fill="url(#cal-header)"/>

  <!-- Calendar rings -->
  <rect x="70" y="30" width="6" height="14" rx="3" fill="#1E3A5F"/>
  <rect x="122" y="30" width="6" height="14" rx="3" fill="#1E3A5F"/>

  <!-- Calendar header text (month dots) -->
  <circle cx="88" cy="48" r="2" fill="white" opacity="0.9"/>
  <circle cx="96" cy="48" r="2" fill="white" opacity="0.9"/>
  <circle cx="104" cy="48" r="2" fill="white" opacity="0.9"/>

  <!-- Calendar grid lines (subtle) -->
  <line x1="58" y1="82" x2="140" y2="82" stroke="#F97316" stroke-width="0.5" opacity="0.15"/>
  <line x1="58" y1="98" x2="140" y2="98" stroke="#F97316" stroke-width="0.5" opacity="0.15"/>
  <line x1="58" y1="114" x2="140" y2="114" stroke="#F97316" stroke-width="0.5" opacity="0.15"/>

  <!-- Empty day cells (subtle dots) -->
  <g fill="#1E3A5F" opacity="0.12">
    <circle cx="68" cy="74" r="2"/>
    <circle cx="84" cy="74" r="2"/>
    <circle cx="100" cy="74" r="2"/>
    <circle cx="116" cy="74" r="2"/>
    <circle cx="132" cy="74" r="2"/>
    <circle cx="68" cy="90" r="2"/>
    <circle cx="84" cy="90" r="2"/>
    <circle cx="100" cy="90" r="2"/>
    <circle cx="116" cy="90" r="2"/>
    <circle cx="132" cy="90" r="2"/>
    <circle cx="68" cy="106" r="2"/>
    <circle cx="84" cy="106" r="2"/>
  </g>

  <!-- Smiley face on calendar -->
  <!-- Eyes -->
  <circle cx="90" cy="98" r="2.5" fill="#1E3A5F"/>
  <circle cx="108" cy="98" r="2.5" fill="#1E3A5F"/>

  <!-- Eye shine -->
  <circle cx="91" cy="97" r="0.8" fill="white"/>
  <circle cx="109" cy="97" r="0.8" fill="white"/>

  <!-- Rosy cheeks -->
  <circle cx="84" cy="106" r="4" fill="#F97316" opacity="0.15"/>
  <circle cx="114" cy="106" r="4" fill="#F97316" opacity="0.15"/>

  <!-- Smile -->
  <path d="M88,108 Q99,118 110,108" fill="none" stroke="#F97316" stroke-width="2" stroke-linecap="round"/>

  <!-- Sparkle decorations -->
  <g fill="#FBBF24">
    <!-- Star top-right -->
    <path d="M155,30 L157,36 L163,36 L158,40 L160,46 L155,42 L150,46 L152,40 L147,36 L153,36 Z" opacity="0.5"/>
    <!-- Small star left -->
    <path d="M32,55 L33.5,59 L37.5,59 L34.5,61.5 L35.5,65.5 L32,63 L28.5,65.5 L29.5,61.5 L26.5,59 L30.5,59 Z" opacity="0.35"/>
  </g>

  <!-- Small heart -->
  <path d="M165,70 C165,66 170,64 172,68 C174,64 179,66 179,70 C179,74 172,80 172,80 C172,80 165,74 165,70 Z" fill="#F97316" opacity="0.2"/>
</svg>
