<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="ec-wallet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1E3A5F"/>
      <stop offset="100%" stop-color="#162D4A"/>
    </linearGradient>
    <linearGradient id="ec-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2A4F7A"/>
      <stop offset="100%" stop-color="#1E3A5F"/>
    </linearGradient>
  </defs>

  <!-- Subtle background glow -->
  <radialGradient id="ec-glow" cx="100" cy="95" r="60" gradientUnits="userSpaceOnUse">
    <stop offset="0%" stop-color="#FBBF24" stop-opacity="0.1"/>
    <stop offset="100%" stop-color="#FBBF24" stop-opacity="0"/>
  </radialGradient>
  <circle cx="100" cy="95" r="60" fill="url(#ec-glow)"/>

  <!-- Wallet shadow -->
  <ellipse cx="98" cy="158" rx="38" ry="5" fill="#1E3A5F" opacity="0.06"/>

  <!-- Wallet body -->
  <rect x="48" y="68" width="90" height="70" rx="10" fill="url(#ec-wallet)"/>
  <!-- Wallet flap -->
  <path d="M48,88 L48,78 Q48,68 58,68 L128,68 Q138,68 138,78 L138,88 Q138,96 128,96 L58,96 Q48,96 48,88 Z" fill="#1E3A5F"/>
  <!-- Wallet flap line -->
  <line x1="55" y1="96" x2="131" y2="96" stroke="#F97316" stroke-width="1.5" opacity="0.4"/>
  <!-- Wallet clasp -->
  <circle cx="93" cy="96" r="5" fill="#F97316"/>
  <circle cx="93" cy="96" r="3" fill="#FBBF24"/>

  <!-- Wallet inside (empty indication) -->
  <rect x="58" y="100" width="70" height="30" rx="4" fill="#0F2744" opacity="0.3"/>
  <!-- Dotted line suggesting empty -->
  <line x1="68" y1="115" x2="118" y2="115" stroke="#FFFBF5" stroke-width="1" stroke-dasharray="4,5" opacity="0.2"/>

  <!-- Coin floating above wallet (encouraging to add) -->
  <g transform="translate(130, 55)">
    <circle cx="0" cy="0" r="12" fill="#FBBF24" opacity="0.7"/>
    <circle cx="0" cy="0" r="9" fill="#FBBF24"/>
    <circle cx="0" cy="0" r="7" fill="none" stroke="#F97316" stroke-width="1" opacity="0.4"/>
    <!-- Dollar/credit symbol -->
    <text x="0" y="4" font-family="sans-serif" font-size="11" font-weight="bold" fill="#F97316" text-anchor="middle" opacity="0.7">+</text>
  </g>

  <!-- Mascot peeking from behind wallet (right side) -->
  <g transform="translate(138, 72)">
    <!-- Part of body visible -->
    <rect x="0" y="18" width="16" height="40" rx="3" fill="url(#ec-body)"/>
    <!-- Stripe -->
    <rect x="0" y="30" width="16" height="4" rx="1" fill="#F97316" opacity="0.85"/>

    <!-- Head peeking -->
    <!-- Cap -->
    <polygon points="0,18 8,6 16,18" fill="#1E3A5F"/>
    <!-- Lamp -->
    <circle cx="8" cy="7" r="4" fill="#FBBF24"/>
    <circle cx="8" cy="7" r="2.5" fill="#FDE68A"/>

    <!-- Eyes (curious, looking at wallet) -->
    <circle cx="4" cy="24" r="2.5" fill="white"/>
    <circle cx="14" cy="24" r="2.5" fill="white"/>
    <circle cx="3" cy="24" r="1.5" fill="#1E3A5F"/>
    <circle cx="13" cy="24" r="1.5" fill="#1E3A5F"/>
    <!-- Eye shine -->
    <circle cx="3.5" cy="23.5" r="0.6" fill="white"/>
    <circle cx="13.5" cy="23.5" r="0.6" fill="white"/>

    <!-- Little smile -->
    <path d="M4,28 Q8,32 12,28" fill="none" stroke="#FFFBF5" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Hand waving from side -->
    <circle cx="-4" cy="38" r="3.5" fill="#FBBF24"/>
  </g>

  <!-- Small sparkles -->
  <g transform="translate(45, 50)">
    <line x1="0" y1="-4" x2="0" y2="4" stroke="#FBBF24" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>
    <line x1="-4" y1="0" x2="4" y2="0" stroke="#FBBF24" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>
  </g>

  <g transform="translate(165, 35)">
    <line x1="0" y1="-3" x2="0" y2="3" stroke="#5EEAD4" stroke-width="1.5" stroke-linecap="round" opacity="0.35"/>
    <line x1="-3" y1="0" x2="3" y2="0" stroke="#5EEAD4" stroke-width="1.5" stroke-linecap="round" opacity="0.35"/>
  </g>

  <!-- Decorative dots -->
  <circle cx="30" cy="80" r="2" fill="#F97316" opacity="0.2"/>
  <circle cx="175" cy="130" r="1.5" fill="#5EEAD4" opacity="0.25"/>
  <circle cx="40" cy="145" r="1.5" fill="#FBBF24" opacity="0.3"/>
  <circle cx="165" cy="165" r="2" fill="#D1FAE5" opacity="0.3"/>

  <!-- Small star -->
  <path d="M32,35 L33.5,39 L37.5,39 L34.5,41.5 L35.5,45.5 L32,43 L28.5,45.5 L29.5,41.5 L26.5,39 L30.5,39 Z" fill="#FBBF24" opacity="0.35"/>

  <!-- Wave decoration at bottom -->
  <path d="M15,180 Q40,174 65,180 Q90,186 115,180 Q140,174 165,180 Q180,184 195,180" fill="none" stroke="#5EEAD4" stroke-width="1.5" stroke-linecap="round" opacity="0.3"/>
  <path d="M5,190 Q35,185 65,190 Q95,195 125,190 Q155,185 185,190" fill="none" stroke="#5EEAD4" stroke-width="1" stroke-linecap="round" opacity="0.18"/>
</svg>