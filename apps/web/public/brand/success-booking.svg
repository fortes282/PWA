<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="sb-cal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFBF5"/>
      <stop offset="100%" stop-color="#FFF5EB"/>
    </linearGradient>
    <linearGradient id="sb-header" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#FB923C"/>
    </linearGradient>
    <linearGradient id="sb-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2A4F7A"/>
      <stop offset="100%" stop-color="#1E3A5F"/>
    </linearGradient>
    <radialGradient id="sb-glow" cx="100" cy="80" r="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#5EEAD4" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#5EEAD4" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background glow -->
  <circle cx="100" cy="80" r="60" fill="url(#sb-glow)"/>

  <!-- Calendar shadow -->
  <ellipse cx="82" cy="152" rx="35" ry="5" fill="#1E3A5F" opacity="0.06"/>

  <!-- Calendar body -->
  <rect x="40" y="38" width="80" height="90" rx="10" fill="url(#sb-cal)" stroke="#F97316" stroke-width="1.2" stroke-opacity="0.3"/>

  <!-- Calendar header -->
  <rect x="40" y="38" width="80" height="24" rx="10" fill="url(#sb-header)"/>
  <rect x="40" y="52" width="80" height="10" fill="url(#sb-header)"/>

  <!-- Calendar rings -->
  <rect x="58" y="33" width="5" height="12" rx="2.5" fill="#1E3A5F"/>
  <rect x="97" y="33" width="5" height="12" rx="2.5" fill="#1E3A5F"/>

  <!-- Calendar grid (subtle) -->
  <g stroke="#F97316" stroke-width="0.5" opacity="0.12">
    <line x1="52" y1="78" x2="108" y2="78"/>
    <line x1="52" y1="92" x2="108" y2="92"/>
    <line x1="52" y1="106" x2="108" y2="106"/>
  </g>

  <!-- Day dots -->
  <g fill="#1E3A5F" opacity="0.12">
    <circle cx="58" cy="72" r="2"/>
    <circle cx="72" cy="72" r="2"/>
    <circle cx="86" cy="72" r="2"/>
    <circle cx="100" cy="72" r="2"/>
    <circle cx="58" cy="86" r="2"/>
    <circle cx="72" cy="86" r="2"/>
    <circle cx="100" cy="86" r="2"/>
    <circle cx="58" cy="100" r="2"/>
    <circle cx="72" cy="100" r="2"/>
  </g>

  <!-- Big checkmark on calendar (booked date) -->
  <g transform="translate(86, 86)">
    <circle cx="0" cy="0" r="10" fill="#5EEAD4" opacity="0.25"/>
    <path d="M-6,-1 L-2,4 L7,-6" fill="none" stroke="#5EEAD4" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Mascot celebrating (right side) -->
  <g transform="translate(125, 45)">
    <!-- Lamp glow -->
    <radialGradient id="sb-lamp" cx="142" cy="42" r="16" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FBBF24" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#FBBF24" stop-opacity="0"/>
    </radialGradient>
    <circle cx="17" cy="-3" r="16" fill="#FBBF24" opacity="0.15"/>

    <!-- Lamp -->
    <circle cx="17" cy="-2" r="5" fill="#FBBF24"/>
    <circle cx="17" cy="-2" r="3" fill="#FDE68A"/>
    <circle cx="15.5" cy="-4" r="1.2" fill="white" opacity="0.4"/>

    <!-- Cap -->
    <polygon points="9,10 17,-2 25,10" fill="#1E3A5F"/>

    <!-- Body -->
    <rect x="9" y="10" width="16" height="48" rx="3" fill="url(#sb-body)"/>

    <!-- Stripes -->
    <rect x="9" y="22" width="16" height="4" rx="1" fill="#F97316" opacity="0.85"/>
    <rect x="9" y="38" width="16" height="4" rx="1" fill="#F97316" opacity="0.85"/>

    <!-- Window -->
    <rect x="13" y="14" width="8" height="5" rx="1.5" fill="#FBBF24" opacity="0.7"/>

    <!-- Eyes (happy squint ^_^) -->
    <path d="M11,28 Q14.5,24 18,28" fill="none" stroke="white" stroke-width="2" stroke-linecap="round"/>
    <path d="M19,28 Q22.5,24 26,28" fill="none" stroke="white" stroke-width="2" stroke-linecap="round"/>

    <!-- Rosy cheeks -->
    <circle cx="10" cy="33" r="3" fill="#F97316" opacity="0.2"/>
    <circle cx="26" cy="33" r="3" fill="#F97316" opacity="0.2"/>

    <!-- Big smile -->
    <path d="M13,34 Q17,42 23,34" fill="#FFFBF5" stroke="#FFFBF5" stroke-width="0.5"/>

    <!-- Arms RAISED (celebrating) -->
    <path d="M9,24 C0,18 -6,8 -8,2" fill="none" stroke="#1E3A5F" stroke-width="3.5" stroke-linecap="round"/>
    <circle cx="-9" cy="1" r="3.5" fill="#FBBF24"/>

    <path d="M25,24 C34,18 40,8 42,2" fill="none" stroke="#1E3A5F" stroke-width="3.5" stroke-linecap="round"/>
    <circle cx="43" cy="1" r="3.5" fill="#FBBF24"/>

    <!-- Door -->
    <rect x="12" y="50" width="10" height="8" rx="5" fill="#0F2744"/>

    <!-- Feet -->
    <ellipse cx="12" cy="61" rx="7" ry="3" fill="#1E3A5F"/>
    <ellipse cx="24" cy="61" rx="7" ry="3" fill="#1E3A5F"/>
    <ellipse cx="11" cy="60" rx="3.5" ry="1.5" fill="#2A4F7A"/>
    <ellipse cx="23" cy="60" rx="3.5" ry="1.5" fill="#2A4F7A"/>
  </g>

  <!-- Confetti dots (celebration!) -->
  <circle cx="20" cy="25" r="3" fill="#F97316" opacity="0.3"/>
  <circle cx="55" cy="18" r="2.5" fill="#5EEAD4" opacity="0.35"/>
  <circle cx="120" cy="15" r="2" fill="#FBBF24" opacity="0.4"/>
  <circle cx="180" cy="30" r="2.5" fill="#5EEAD4" opacity="0.3"/>
  <circle cx="25" cy="55" r="2" fill="#FBBF24" opacity="0.3"/>
  <circle cx="190" cy="80" r="2" fill="#D1FAE5" opacity="0.35"/>
  <circle cx="15" cy="110" r="2.5" fill="#F97316" opacity="0.2"/>
  <circle cx="185" cy="120" r="1.5" fill="#FBBF24" opacity="0.35"/>
  <circle cx="170" cy="150" r="2" fill="#D1FAE5" opacity="0.3"/>
  <circle cx="30" cy="140" r="1.5" fill="#5EEAD4" opacity="0.25"/>

  <!-- Big sparkle top-left -->
  <g transform="translate(25, 40)">
    <line x1="0" y1="-7" x2="0" y2="7" stroke="#FBBF24" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
    <line x1="-7" y1="0" x2="7" y2="0" stroke="#FBBF24" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
    <line x1="-4.5" y1="-4.5" x2="4.5" y2="4.5" stroke="#FBBF24" stroke-width="1.2" stroke-linecap="round" opacity="0.3"/>
    <line x1="4.5" y1="-4.5" x2="-4.5" y2="4.5" stroke="#FBBF24" stroke-width="1.2" stroke-linecap="round" opacity="0.3"/>
  </g>

  <!-- Medium sparkle -->
  <g transform="translate(175, 60)">
    <line x1="0" y1="-5" x2="0" y2="5" stroke="#F97316" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>
    <line x1="-5" y1="0" x2="5" y2="0" stroke="#F97316" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>
  </g>

  <!-- Small sparkle -->
  <g transform="translate(10, 85)">
    <line x1="0" y1="-4" x2="0" y2="4" stroke="#5EEAD4" stroke-width="1.5" stroke-linecap="round" opacity="0.35"/>
    <line x1="-4" y1="0" x2="4" y2="0" stroke="#5EEAD4" stroke-width="1.5" stroke-linecap="round" opacity="0.35"/>
  </g>

  <!-- Stars -->
  <path d="M45,15 L46.5,19 L51,19 L47.5,22 L48.5,26 L45,23 L41.5,26 L42.5,22 L39,19 L43.5,19 Z" fill="#FBBF24" opacity="0.45"/>
  <path d="M165,10 L166,13 L169,13 L167,15 L167.5,18 L165,16 L162.5,18 L163,15 L161,13 L164,13 Z" fill="#F97316" opacity="0.35"/>

  <!-- Wave decoration at bottom -->
  <path d="M15,175 Q40,169 65,175 Q90,181 115,175 Q140,169 165,175 Q180,179 195,175" fill="none" stroke="#5EEAD4" stroke-width="1.5" stroke-linecap="round" opacity="0.3"/>
  <path d="M5,185 Q35,180 65,185 Q95,190 125,185 Q155,180 185,185" fill="none" stroke="#5EEAD4" stroke-width="1" stroke-linecap="round" opacity="0.18"/>
</svg>