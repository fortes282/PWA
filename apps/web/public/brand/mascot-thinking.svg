<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 160">
  <defs>
    <linearGradient id="mt-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3B4279"/>
      <stop offset="100%" stop-color="#242B61"/>
    </linearGradient>
    <radialGradient id="mt-glow" cx="60" cy="18" r="22" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E86A24" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#E86A24" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#E86A24" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mt-stripe" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E86A24"/>
      <stop offset="100%" stop-color="#E8874A"/>
    </linearGradient>
  </defs>

  <!-- Shadow -->
  <ellipse cx="62" cy="150" rx="30" ry="5" fill="#242B61" opacity="0.08"/>

  <!-- Moderate glow behind lamp -->
  <circle cx="60" cy="18" r="20" fill="url(#mt-glow)"/>

  <!-- Lamp light (moderate) -->
  <circle cx="60" cy="18" r="7" fill="#FBBF24" opacity="0.8"/>
  <circle cx="60" cy="18" r="4.5" fill="#FDE68A" opacity="0.8"/>
  <!-- Lamp shine -->
  <circle cx="57" cy="15" r="1.8" fill="white" opacity="0.4"/>

  <!-- Lighthouse cap / roof -->
  <polygon points="44,35 60,18 76,35" fill="#242B61"/>

  <!-- Lighthouse body (main) -->
  <rect x="42" y="35" width="36" height="80" rx="4" fill="url(#mt-body)"/>

  <!-- Stripe decorations -->
  <rect x="42" y="55" width="36" height="7" rx="1" fill="url(#mt-stripe)" opacity="0.85"/>
  <rect x="42" y="82" width="36" height="7" rx="1" fill="url(#mt-stripe)" opacity="0.85"/>

  <!-- Window/belly -->
  <rect x="52" y="42" width="16" height="10" rx="3" fill="#FBBF24" opacity="0.8"/>

  <!-- Face - thinking -->
  <!-- Left eye (open) -->
  <circle cx="52" cy="70" r="3.5" fill="white"/>
  <circle cx="53" cy="70" r="2" fill="#0D144B"/>
  <circle cx="54" cy="69" r="0.8" fill="white"/>

  <!-- Right eye (squinting) -->
  <path d="M64,70 Q68,67 72,70" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Rosy cheeks -->
  <circle cx="46" cy="75" r="3.5" fill="#E86A24" opacity="0.15"/>
  <circle cx="74" cy="75" r="3.5" fill="#E86A24" opacity="0.15"/>

  <!-- Thinking mouth (small "hmm" line shifted to side) -->
  <path d="M58,78 L65,77" fill="none" stroke="#F8F9FF" stroke-width="2" stroke-linecap="round"/>

  <!-- Left arm (relaxed at side) -->
  <g>
    <path d="M42,65 C32,68 28,78 30,82" fill="none" stroke="#242B61" stroke-width="5" stroke-linecap="round"/>
    <!-- Left hand -->
    <circle cx="30" cy="83" r="5" fill="#FBBF24"/>
  </g>

  <!-- Right arm (raised to chin - thinking pose) -->
  <g>
    <path d="M78,65 C86,62 84,72 78,78" fill="none" stroke="#242B61" stroke-width="5" stroke-linecap="round"/>
    <!-- Right hand at chin -->
    <circle cx="77" cy="79" r="5" fill="#FBBF24"/>
  </g>

  <!-- Door / feet area -->
  <rect x="52" y="100" width="16" height="15" rx="8" fill="#0D144B"/>

  <!-- Feet -->
  <ellipse cx="50" cy="118" rx="10" ry="5" fill="#242B61"/>
  <ellipse cx="70" cy="118" rx="10" ry="5" fill="#242B61"/>

  <!-- Shoe highlights -->
  <ellipse cx="48" cy="117" rx="5" ry="2" fill="#3B4279"/>
  <ellipse cx="68" cy="117" rx="5" ry="2" fill="#3B4279"/>

  <!-- Thought bubble trail (3 small circles leading to cloud) -->
  <circle cx="82" cy="58" r="2" fill="#F8F9FF" opacity="0.5"/>
  <circle cx="88" cy="50" r="2.8" fill="#F8F9FF" opacity="0.6"/>
  <circle cx="92" cy="42" r="3.5" fill="#F8F9FF" opacity="0.7"/>

  <!-- Thought bubble (cloud shape) -->
  <g opacity="0.85">
    <circle cx="100" cy="26" r="8" fill="#F8F9FF"/>
    <circle cx="108" cy="28" r="7" fill="#F8F9FF"/>
    <circle cx="93" cy="28" r="6.5" fill="#F8F9FF"/>
    <circle cx="97" cy="21" r="6" fill="#F8F9FF"/>
    <circle cx="106" cy="22" r="5.5" fill="#F8F9FF"/>
    <rect x="90" y="22" width="22" height="12" rx="3" fill="#F8F9FF"/>
  </g>

  <!-- Question mark inside thought bubble -->
  <text x="100" y="32" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#3B4279" text-anchor="middle">?</text>

  <!-- Small gear/cog icon near thought bubble -->
  <g transform="translate(112, 12)" opacity="0.35">
    <circle cx="0" cy="0" r="4" fill="none" stroke="#3B4279" stroke-width="1.2"/>
    <circle cx="0" cy="0" r="1.5" fill="#3B4279"/>
    <!-- Gear teeth -->
    <line x1="0" y1="-5.5" x2="0" y2="-3" stroke="#3B4279" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="0" y1="3" x2="0" y2="5.5" stroke="#3B4279" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="-5.5" y1="0" x2="-3" y2="0" stroke="#3B4279" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="3" y1="0" x2="5.5" y2="0" stroke="#3B4279" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="-3.9" y1="-3.9" x2="-2.1" y2="-2.1" stroke="#3B4279" stroke-width="1.3" stroke-linecap="round"/>
    <line x1="2.1" y1="2.1" x2="3.9" y2="3.9" stroke="#3B4279" stroke-width="1.3" stroke-linecap="round"/>
    <line x1="3.9" y1="-3.9" x2="2.1" y2="-2.1" stroke="#3B4279" stroke-width="1.3" stroke-linecap="round"/>
    <line x1="-2.1" y1="2.1" x2="-3.9" y2="3.9" stroke="#3B4279" stroke-width="1.3" stroke-linecap="round"/>
  </g>
</svg>
