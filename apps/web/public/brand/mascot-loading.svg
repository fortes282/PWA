<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 160">
  <defs>
    <linearGradient id="ml-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3B4279"/>
      <stop offset="100%" stop-color="#242B61"/>
    </linearGradient>
    <radialGradient id="ml-glow" cx="60" cy="16" r="28" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FBBF24" stop-opacity="0.55"/>
      <stop offset="40%" stop-color="#E86A24" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#E86A24" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ml-stripe" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E86A24"/>
      <stop offset="100%" stop-color="#E8874A"/>
    </linearGradient>
  </defs>

  <!-- Shadow -->
  <ellipse cx="62" cy="150" rx="30" ry="5" fill="#242B61" opacity="0.08"/>

  <!-- Bright glow behind lamp -->
  <circle cx="60" cy="16" r="26" fill="url(#ml-glow)"/>

  <!-- Glow rays (actively searching) -->
  <g stroke="#FBBF24" stroke-width="1.5" stroke-linecap="round" opacity="0.3">
    <line x1="60" y1="0" x2="60" y2="-8"/>
    <line x1="74" y1="4" x2="80" y2="-2"/>
    <line x1="46" y1="4" x2="40" y2="-2"/>
    <line x1="80" y1="16" x2="88" y2="14"/>
    <line x1="40" y1="16" x2="32" y2="14"/>
  </g>

  <!-- Lamp light (bright) -->
  <circle cx="60" cy="16" r="9" fill="#FBBF24"/>
  <circle cx="60" cy="16" r="5.5" fill="#FDE68A"/>
  <!-- Lamp shine -->
  <circle cx="57" cy="13" r="2.2" fill="white" opacity="0.5"/>

  <!-- Circular spinner near lamp (outline only, teal) -->
  <g transform="translate(82, 10)" opacity="0.4">
    <path d="M0,-7 A7,7 0 1,1 -5,-5" fill="none" stroke="#5EEAD4" stroke-width="1.8" stroke-linecap="round"/>
    <!-- Arrow tip on spinner -->
    <polygon points="-6.5,-3 -3.5,-6.5 -3,-3" fill="#5EEAD4"/>
  </g>

  <!-- Lighthouse cap / roof -->
  <polygon points="44,33 60,16 76,33" fill="#242B61"/>

  <!-- Lighthouse body (main) -->
  <rect x="42" y="33" width="36" height="80" rx="4" fill="url(#ml-body)"/>

  <!-- Stripe decorations -->
  <rect x="42" y="53" width="36" height="7" rx="1" fill="url(#ml-stripe)" opacity="0.85"/>
  <rect x="42" y="80" width="36" height="7" rx="1" fill="url(#ml-stripe)" opacity="0.85"/>

  <!-- Window/belly -->
  <rect x="52" y="40" width="16" height="10" rx="3" fill="#FBBF24" opacity="0.8"/>

  <!-- Face - patient / looking up -->
  <!-- Eyes (dot eyes looking up) -->
  <circle cx="52" cy="68" r="3.5" fill="white"/>
  <circle cx="68" cy="68" r="3.5" fill="white"/>
  <circle cx="52" cy="67" r="2" fill="#0D144B"/>
  <circle cx="68" cy="67" r="2" fill="#0D144B"/>
  <!-- Eye shine -->
  <circle cx="53" cy="66" r="0.8" fill="white"/>
  <circle cx="69" cy="66" r="0.8" fill="white"/>

  <!-- Rosy cheeks -->
  <circle cx="46" cy="73" r="3.5" fill="#E86A24" opacity="0.16"/>
  <circle cx="74" cy="73" r="3.5" fill="#E86A24" opacity="0.16"/>

  <!-- Small neutral mouth -->
  <line x1="55" y1="77" x2="65" y2="77" stroke="#F8F9FF" stroke-width="2" stroke-linecap="round"/>

  <!-- Left arm (at side, slightly forward) -->
  <g>
    <path d="M42,63 C32,66 26,74 28,80" fill="none" stroke="#242B61" stroke-width="5" stroke-linecap="round"/>
    <!-- Left hand -->
    <circle cx="28" cy="81" r="5" fill="#FBBF24"/>
  </g>

  <!-- Right arm (at side) -->
  <g>
    <path d="M78,63 C88,66 92,76 90,82" fill="none" stroke="#242B61" stroke-width="5" stroke-linecap="round"/>
    <!-- Right hand -->
    <circle cx="90" cy="83" r="5" fill="#FBBF24"/>
  </g>

  <!-- Door / feet area -->
  <rect x="52" y="98" width="16" height="15" rx="8" fill="#0D144B"/>

  <!-- Feet -->
  <ellipse cx="50" cy="116" rx="10" ry="5" fill="#242B61"/>
  <ellipse cx="70" cy="116" rx="10" ry="5" fill="#242B61"/>

  <!-- Shoe highlights -->
  <ellipse cx="48" cy="115" rx="5" ry="2" fill="#3B4279"/>
  <ellipse cx="68" cy="115" rx="5" ry="2" fill="#3B4279"/>

  <!-- 3 Loading dots below feet (gold, different sizes) -->
  <circle cx="50" cy="135" r="3" fill="#FBBF24" opacity="0.9"/>
  <circle cx="60" cy="135" r="3.5" fill="#FBBF24" opacity="0.65"/>
  <circle cx="70" cy="135" r="2.5" fill="#FBBF24" opacity="0.4"/>

  <!-- Clock icon near top-right (subtle, small) -->
  <g transform="translate(104, 38)" opacity="0.35">
    <circle cx="0" cy="0" r="6" fill="none" stroke="#3B4279" stroke-width="1.3"/>
    <!-- Clock hands -->
    <line x1="0" y1="0" x2="0" y2="-3.5" stroke="#3B4279" stroke-width="1.3" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="2.5" y2="1" stroke="#3B4279" stroke-width="1.1" stroke-linecap="round"/>
    <!-- Center dot -->
    <circle cx="0" cy="0" r="0.8" fill="#3B4279"/>
    <!-- Hour markers -->
    <circle cx="0" cy="-5" r="0.5" fill="#3B4279"/>
    <circle cx="5" cy="0" r="0.5" fill="#3B4279"/>
    <circle cx="0" cy="5" r="0.5" fill="#3B4279"/>
    <circle cx="-5" cy="0" r="0.5" fill="#3B4279"/>
  </g>
</svg>
