<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="em-env" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFBF5"/>
      <stop offset="100%" stop-color="#FFF5EB"/>
    </linearGradient>
    <linearGradient id="em-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2A4F7A"/>
      <stop offset="100%" stop-color="#1E3A5F"/>
    </linearGradient>
  </defs>

  <!-- Subtle background glow -->
  <radialGradient id="em-glow" cx="100" cy="90" r="55" gradientUnits="userSpaceOnUse">
    <stop offset="0%" stop-color="#5EEAD4" stop-opacity="0.1"/>
    <stop offset="100%" stop-color="#5EEAD4" stop-opacity="0"/>
  </radialGradient>
  <circle cx="100" cy="90" r="55" fill="url(#em-glow)"/>

  <!-- Envelope shadow -->
  <ellipse cx="98" cy="148" rx="42" ry="5" fill="#1E3A5F" opacity="0.06"/>

  <!-- Envelope body -->
  <rect x="38" y="62" width="108" height="72" rx="8" fill="url(#em-env)" stroke="#F97316" stroke-width="1.2" stroke-opacity="0.3"/>

  <!-- Envelope flap -->
  <path d="M38,70 L92,108 L146,70" fill="none" stroke="#F97316" stroke-width="1.5" opacity="0.4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Envelope flap top -->
  <path d="M38,62 Q38,62 46,62 L92,94 L138,62 Q146,62 146,62 L146,70 L92,108 L38,70 Z" fill="#FFFBF5" stroke="#F97316" stroke-width="1.2" stroke-opacity="0.2"/>

  <!-- Heart on envelope -->
  <g transform="translate(92, 86)">
    <path d="M0,-4 C0,-8 5,-10 7,-6 C9,-10 14,-8 14,-4 C14,0 7,6 7,6 C7,6 0,0 0,-4 Z" fill="#F97316" opacity="0.45" transform="translate(-7, -1)"/>
  </g>

  <!-- Envelope lines (message preview) -->
  <g opacity="0.12">
    <line x1="55" y1="118" x2="128" y2="118" stroke="#1E3A5F" stroke-width="1.5" stroke-dasharray="4,5" stroke-linecap="round"/>
    <line x1="65" y1="126" x2="118" y2="126" stroke="#1E3A5F" stroke-width="1.5" stroke-dasharray="4,5" stroke-linecap="round"/>
  </g>

  <!-- Mascot peeking from bottom-right of envelope -->
  <g transform="translate(138, 88)">
    <!-- Lamp glow -->
    <circle cx="10" cy="-8" r="8" fill="#FBBF24" opacity="0.15"/>
    <!-- Lamp -->
    <circle cx="10" cy="-6" r="3" fill="#FBBF24"/>
    <circle cx="10" cy="-6" r="1.8" fill="#FDE68A"/>

    <!-- Cap -->
    <polygon points="4,2 10,-6 16,2" fill="#1E3A5F"/>

    <!-- Body (partial) -->
    <rect x="4" y="2" width="12" height="35" rx="2" fill="url(#em-body)"/>

    <!-- Stripe -->
    <rect x="4" y="12" width="12" height="3" rx="1" fill="#F97316" opacity="0.85"/>
    <rect x="4" y="24" width="12" height="3" rx="1" fill="#F97316" opacity="0.85"/>

    <!-- Eyes (calm, content) -->
    <circle cx="7" cy="7" r="2" fill="white"/>
    <circle cx="15" cy="7" r="2" fill="white"/>
    <circle cx="7.5" cy="7" r="1.2" fill="#1E3A5F"/>
    <circle cx="15.5" cy="7" r="1.2" fill="#1E3A5F"/>
    <circle cx="7.8" cy="6.5" r="0.5" fill="white"/>
    <circle cx="15.8" cy="6.5" r="0.5" fill="white"/>

    <!-- Gentle smile -->
    <path d="M7,10 Q10,13 14,10" fill="none" stroke="#FFFBF5" stroke-width="1.2" stroke-linecap="round"/>

    <!-- Waving hand -->
    <path d="M4,14 C-2,12 -6,8 -8,4" fill="none" stroke="#1E3A5F" stroke-width="3" stroke-linecap="round"/>
    <circle cx="-8" cy="3" r="3" fill="#FBBF24"/>
  </g>

  <!-- Sparkles -->
  <g transform="translate(35, 42)">
    <line x1="0" y1="-5" x2="0" y2="5" stroke="#FBBF24" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>
    <line x1="-5" y1="0" x2="5" y2="0" stroke="#FBBF24" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>
  </g>

  <g transform="translate(168, 48)">
    <line x1="0" y1="-4" x2="0" y2="4" stroke="#5EEAD4" stroke-width="1.5" stroke-linecap="round" opacity="0.35"/>
    <line x1="-4" y1="0" x2="4" y2="0" stroke="#5EEAD4" stroke-width="1.5" stroke-linecap="round" opacity="0.35"/>
  </g>

  <!-- Decorative dots -->
  <circle cx="28" cy="70" r="2" fill="#F97316" opacity="0.2"/>
  <circle cx="175" cy="65" r="1.5" fill="#FBBF24" opacity="0.3"/>
  <circle cx="25" cy="120" r="1.5" fill="#5EEAD4" opacity="0.25"/>
  <circle cx="180" cy="150" r="2" fill="#D1FAE5" opacity="0.3"/>

  <!-- Small star -->
  <path d="M160, 30 L161.5,34 L166,34 L162.5,37 L163.5,41 L160,38 L156.5,41 L157.5,37 L154,34 L158.5,34 Z" fill="#FBBF24" opacity="0.35"/>

  <!-- Wave decoration at bottom -->
  <path d="M15,175 Q40,169 65,175 Q90,181 115,175 Q140,169 165,175 Q180,179 195,175" fill="none" stroke="#5EEAD4" stroke-width="1.5" stroke-linecap="round" opacity="0.3"/>
  <path d="M5,185 Q35,180 65,185 Q95,190 125,185 Q155,180 185,185" fill="none" stroke="#5EEAD4" stroke-width="1" stroke-linecap="round" opacity="0.18"/>
</svg>