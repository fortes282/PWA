<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="trophy-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <linearGradient id="trophy-shine" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="white" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="trophy-glow" cx="100" cy="85" r="55" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FBBF24" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#FBBF24" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background glow -->
  <circle cx="100" cy="85" r="55" fill="url(#trophy-glow)"/>

  <!-- Trophy shadow -->
  <ellipse cx="102" cy="158" rx="28" ry="4" fill="#1E3A5F" opacity="0.08"/>

  <!-- Trophy base -->
  <rect x="78" y="148" width="44" height="8" rx="3" fill="#E86A24"/>
  <rect x="88" y="138" width="24" height="12" rx="2" fill="#E86A24" opacity="0.85"/>

  <!-- Trophy stem -->
  <rect x="94" y="118" width="12" height="22" rx="2" fill="url(#trophy-grad)"/>

  <!-- Trophy cup -->
  <path d="M68,50 L68,85 C68,105 82,118 100,118 C118,118 132,105 132,85 L132,50 Z" fill="url(#trophy-grad)"/>

  <!-- Trophy cup shine -->
  <path d="M72,52 L72,82 C72,100 84,112 98,114 C84,112 76,100 76,82 L76,52 Z" fill="url(#trophy-shine)"/>

  <!-- Trophy handles -->
  <path d="M68,60 C50,60 45,75 55,88 C60,94 68,92 68,88" fill="none" stroke="#F59E0B" stroke-width="5" stroke-linecap="round"/>
  <path d="M132,60 C150,60 155,75 145,88 C140,94 132,92 132,88" fill="none" stroke="#F59E0B" stroke-width="5" stroke-linecap="round"/>

  <!-- Star on trophy -->
  <path d="M100,62 L104,74 L117,74 L107,82 L110,94 L100,87 L90,94 L93,82 L83,74 L96,74 Z" fill="#F8F9FF" opacity="0.85"/>

  <!-- Trophy rim -->
  <rect x="66" y="48" width="68" height="6" rx="3" fill="#F59E0B"/>

  <!-- Sparkles around trophy -->
  <!-- Large sparkle top-right -->
  <g transform="translate(148, 35)">
    <line x1="0" y1="-8" x2="0" y2="8" stroke="#E86A24" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
    <line x1="-8" y1="0" x2="8" y2="0" stroke="#E86A24" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
    <line x1="-5" y1="-5" x2="5" y2="5" stroke="#E86A24" stroke-width="1.5" stroke-linecap="round" opacity="0.35"/>
    <line x1="5" y1="-5" x2="-5" y2="5" stroke="#E86A24" stroke-width="1.5" stroke-linecap="round" opacity="0.35"/>
  </g>

  <!-- Medium sparkle top-left -->
  <g transform="translate(42, 42)">
    <line x1="0" y1="-6" x2="0" y2="6" stroke="#FBBF24" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
    <line x1="-6" y1="0" x2="6" y2="0" stroke="#FBBF24" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
  </g>

  <!-- Small sparkle right -->
  <g transform="translate(160, 80)">
    <line x1="0" y1="-4" x2="0" y2="4" stroke="#E86A24" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>
    <line x1="-4" y1="0" x2="4" y2="0" stroke="#E86A24" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>
  </g>

  <!-- Small sparkle left -->
  <g transform="translate(32, 75)">
    <line x1="0" y1="-4" x2="0" y2="4" stroke="#FBBF24" stroke-width="1.5" stroke-linecap="round" opacity="0.45"/>
    <line x1="-4" y1="0" x2="4" y2="0" stroke="#FBBF24" stroke-width="1.5" stroke-linecap="round" opacity="0.45"/>
  </g>

  <!-- Tiny sparkle dots -->
  <circle cx="155" cy="55" r="2" fill="#FBBF24" opacity="0.4"/>
  <circle cx="38" cy="58" r="1.5" fill="#E86A24" opacity="0.3"/>
  <circle cx="165" cy="105" r="1.5" fill="#FBBF24" opacity="0.35"/>
  <circle cx="28" cy="95" r="2" fill="#E86A24" opacity="0.25"/>

  <!-- Confetti dots -->
  <circle cx="55" cy="25" r="3" fill="#E86A24" opacity="0.2"/>
  <circle cx="140" cy="20" r="2.5" fill="#5EEAD4" opacity="0.3"/>
  <circle cx="170" cy="125" r="2" fill="#5EEAD4" opacity="0.2"/>
  <circle cx="25" cy="115" r="2.5" fill="#D1FAE5" opacity="0.35"/>

  <!-- Encouraging text placeholder (subtle dotted line) -->
  <g opacity="0.15">
    <line x1="65" y1="178" x2="135" y2="178" stroke="#1E3A5F" stroke-width="1.5" stroke-dasharray="3,4" stroke-linecap="round"/>
    <line x1="75" y1="188" x2="125" y2="188" stroke="#1E3A5F" stroke-width="1.5" stroke-dasharray="3,4" stroke-linecap="round"/>
  </g>
</svg>
