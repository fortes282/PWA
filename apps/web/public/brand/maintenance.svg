<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="mt-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2A4F7A"/>
      <stop offset="100%" stop-color="#1E3A5F"/>
    </linearGradient>
    <linearGradient id="mt-stripe" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E86A24"/>
      <stop offset="100%" stop-color="#E8874A"/>
    </linearGradient>
    <linearGradient id="mt-water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5EEAD4" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#1E3A5F" stop-opacity="0.12"/>
    </linearGradient>
    <radialGradient id="mt-glow" cx="100" cy="55" r="30" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FBBF24" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#FBBF24" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="200" height="200" fill="#F8F9FF"/>

  <!-- Lamp glow -->
  <circle cx="100" cy="55" r="30" fill="url(#mt-glow)"/>

  <!-- Shadow -->
  <ellipse cx="102" cy="155" rx="30" ry="5" fill="#1E3A5F" opacity="0.06"/>

  <!-- Lamp -->
  <circle cx="100" cy="48" r="8" fill="#FBBF24"/>
  <circle cx="100" cy="48" r="5" fill="#FDE68A"/>
  <circle cx="98" cy="45.5" r="2" fill="white" opacity="0.4"/>

  <!-- Glow rays -->
  <g stroke="#FBBF24" stroke-width="1.5" stroke-linecap="round" opacity="0.25">
    <line x1="100" y1="34" x2="100" y2="28"/>
    <line x1="112" y1="38" x2="117" y2="33"/>
    <line x1="88" y1="38" x2="83" y2="33"/>
  </g>

  <!-- Hard hat on lighthouse (yellow construction hat) -->
  <path d="M82,62 Q84,50 100,46 Q116,50 118,62 Z" fill="#FBBF24"/>
  <!-- Hard hat brim -->
  <rect x="78" y="60" width="44" height="5" rx="2.5" fill="#FBBF24"/>
  <!-- Hard hat stripe -->
  <rect x="86" y="54" width="28" height="3" rx="1" fill="#E86A24" opacity="0.5"/>

  <!-- Cap underneath (visible edges) -->
  <polygon points="86,65 100,56 114,65" fill="#1E3A5F"/>

  <!-- Body -->
  <rect x="84" y="65" width="32" height="72" rx="4" fill="url(#mt-body)"/>

  <!-- Stripes -->
  <rect x="84" y="83" width="32" height="6" rx="1" fill="url(#mt-stripe)" opacity="0.85"/>
  <rect x="84" y="107" width="32" height="6" rx="1" fill="url(#mt-stripe)" opacity="0.85"/>

  <!-- Window -->
  <rect x="93" y="72" width="14" height="8" rx="2.5" fill="#FBBF24" opacity="0.7"/>

  <!-- Face - determined, working -->
  <!-- Eyes (focused) -->
  <circle cx="93" cy="96" r="3" fill="white"/>
  <circle cx="107" cy="96" r="3" fill="white"/>
  <circle cx="94" cy="96" r="1.8" fill="#1E3A5F"/>
  <circle cx="108" cy="96" r="1.8" fill="#1E3A5F"/>
  <!-- Eye shine -->
  <circle cx="94.5" cy="95.5" r="0.7" fill="white"/>
  <circle cx="108.5" cy="95.5" r="0.7" fill="white"/>

  <!-- Rosy cheeks -->
  <circle cx="87" cy="101" r="3" fill="#E86A24" opacity="0.18"/>
  <circle cx="113" cy="101" r="3" fill="#E86A24" opacity="0.18"/>

  <!-- Determined smile (slight) -->
  <path d="M94,103 Q100,109 106,103" fill="none" stroke="#F8F9FF" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Left arm holding wrench -->
  <path d="M84,90 C72,86 64,82 58,76" fill="none" stroke="#1E3A5F" stroke-width="4.5" stroke-linecap="round"/>
  <circle cx="57" cy="75" r="4.5" fill="#FBBF24"/>

  <!-- Wrench -->
  <g transform="translate(42, 58) rotate(-25)">
    <!-- Wrench handle -->
    <rect x="0" y="-2" width="24" height="4" rx="2" fill="#1E3A5F" opacity="0.7"/>
    <!-- Wrench head -->
    <path d="M22,-5 L30,-5 L30,-2 L26,-2 L26,2 L30,2 L30,5 L22,5 Z" fill="#1E3A5F" opacity="0.7"/>
  </g>

  <!-- Right arm relaxed at side -->
  <path d="M116,92 C126,96 132,104 130,110" fill="none" stroke="#1E3A5F" stroke-width="4.5" stroke-linecap="round"/>
  <circle cx="130" cy="111" r="4.5" fill="#FBBF24"/>

  <!-- Door -->
  <rect x="93" y="124" width="14" height="13" rx="7" fill="#0F2744"/>

  <!-- Feet -->
  <ellipse cx="92" cy="141" rx="9" ry="4.5" fill="#1E3A5F"/>
  <ellipse cx="108" cy="141" rx="9" ry="4.5" fill="#1E3A5F"/>
  <ellipse cx="90" cy="140" rx="4.5" ry="1.8" fill="#2A4F7A"/>
  <ellipse cx="106" cy="140" rx="4.5" ry="1.8" fill="#2A4F7A"/>

  <!-- Small gear decoration (maintenance motif) -->
  <g transform="translate(155, 75)" opacity="0.25">
    <circle cx="0" cy="0" r="8" fill="none" stroke="#1E3A5F" stroke-width="2.5"/>
    <circle cx="0" cy="0" r="3" fill="#1E3A5F"/>
    <!-- Gear teeth -->
    <rect x="-1.5" y="-11" width="3" height="4" rx="1" fill="#1E3A5F"/>
    <rect x="-1.5" y="7" width="3" height="4" rx="1" fill="#1E3A5F"/>
    <rect x="-11" y="-1.5" width="4" height="3" rx="1" fill="#1E3A5F"/>
    <rect x="7" y="-1.5" width="4" height="3" rx="1" fill="#1E3A5F"/>
  </g>

  <!-- Small gear -->
  <g transform="translate(40, 85)" opacity="0.18">
    <circle cx="0" cy="0" r="6" fill="none" stroke="#1E3A5F" stroke-width="2"/>
    <circle cx="0" cy="0" r="2" fill="#1E3A5F"/>
    <rect x="-1" y="-8.5" width="2" height="3" rx="0.5" fill="#1E3A5F"/>
    <rect x="-1" y="5.5" width="2" height="3" rx="0.5" fill="#1E3A5F"/>
    <rect x="-8.5" y="-1" width="3" height="2" rx="0.5" fill="#1E3A5F"/>
    <rect x="5.5" y="-1" width="3" height="2" rx="0.5" fill="#1E3A5F"/>
  </g>

  <!-- Harbor waves at bottom -->
  <path d="M0,172 Q25,164 50,172 Q75,180 100,172 Q125,164 150,172 Q175,180 200,172 L200,200 L0,200 Z" fill="url(#mt-water)"/>

  <!-- Wave highlight -->
  <path d="M0,172 Q25,164 50,172 Q75,180 100,172 Q125,164 150,172 Q175,180 200,172" fill="none" stroke="white" stroke-width="1" opacity="0.25" stroke-linecap="round"/>

  <!-- Second wave layer -->
  <path d="M0,182 Q30,176 60,182 Q90,188 120,182 Q150,176 180,182 Q195,186 200,182 L200,200 L0,200 Z" fill="#5EEAD4" opacity="0.15"/>

  <!-- Sparkle -->
  <g transform="translate(165, 45)">
    <line x1="0" y1="-4" x2="0" y2="4" stroke="#FBBF24" stroke-width="1.5" stroke-linecap="round" opacity="0.35"/>
    <line x1="-4" y1="0" x2="4" y2="0" stroke="#FBBF24" stroke-width="1.5" stroke-linecap="round" opacity="0.35"/>
  </g>

  <!-- Decorative dots -->
  <circle cx="30" cy="50" r="2" fill="#E86A24" opacity="0.2"/>
  <circle cx="170" cy="130" r="1.5" fill="#FBBF24" opacity="0.25"/>
  <circle cx="35" cy="140" r="1.5" fill="#5EEAD4" opacity="0.2"/>
</svg>