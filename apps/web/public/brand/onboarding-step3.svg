<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 240">
  <defs>
    <linearGradient id="ob3-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFBF5"/>
      <stop offset="100%" stop-color="#D1FAE5" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="ob3-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2A4F7A"/>
      <stop offset="100%" stop-color="#1E3A5F"/>
    </linearGradient>
    <linearGradient id="ob3-stripe" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#FB923C"/>
    </linearGradient>
    <radialGradient id="ob3-glow" cx="150" cy="60" r="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FBBF24" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#FBBF24" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="300" height="240" fill="url(#ob3-bg)"/>

  <!-- Shadow -->
  <ellipse cx="152" cy="210" rx="40" ry="6" fill="#1E3A5F" opacity="0.06"/>

  <!-- Lamp glow -->
  <circle cx="150" cy="60" r="40" fill="url(#ob3-glow)"/>

  <!-- Lamp light -->
  <circle cx="150" cy="58" r="10" fill="#FBBF24"/>
  <circle cx="150" cy="58" r="6" fill="#FDE68A"/>
  <circle cx="147" cy="55" r="2.5" fill="white" opacity="0.5"/>

  <!-- Glow rays -->
  <g stroke="#FBBF24" stroke-width="1.5" stroke-linecap="round" opacity="0.3">
    <line x1="150" y1="42" x2="150" y2="34"/>
    <line x1="166" y1="48" x2="172" y2="42"/>
    <line x1="134" y1="48" x2="128" y2="42"/>
    <line x1="172" y1="58" x2="180" y2="58"/>
    <line x1="128" y1="58" x2="120" y2="58"/>
  </g>

  <!-- Lighthouse cap -->
  <polygon points="134,76 150,58 166,76" fill="#1E3A5F"/>

  <!-- Lighthouse body -->
  <rect x="132" y="76" width="36" height="80" rx="4" fill="url(#ob3-body)"/>

  <!-- Stripes -->
  <rect x="132" y="96" width="36" height="7" rx="1" fill="url(#ob3-stripe)" opacity="0.85"/>
  <rect x="132" y="123" width="36" height="7" rx="1" fill="url(#ob3-stripe)" opacity="0.85"/>

  <!-- Window/belly -->
  <rect x="142" y="83" width="16" height="10" rx="3" fill="#FBBF24" opacity="0.8"/>

  <!-- Face - friendly, ready to help -->
  <!-- Eyes -->
  <circle cx="142" cy="111" r="3.5" fill="white"/>
  <circle cx="158" cy="111" r="3.5" fill="white"/>
  <circle cx="143" cy="111" r="2" fill="#1E3A5F"/>
  <circle cx="159" cy="111" r="2" fill="#1E3A5F"/>
  <!-- Eye shine -->
  <circle cx="144" cy="110" r="0.8" fill="white"/>
  <circle cx="160" cy="110" r="0.8" fill="white"/>

  <!-- Rosy cheeks -->
  <circle cx="136" cy="116" r="3.5" fill="#F97316" opacity="0.18"/>
  <circle cx="164" cy="116" r="3.5" fill="#F97316" opacity="0.18"/>

  <!-- Confident smile -->
  <path d="M142,118 Q150,126 158,118" fill="none" stroke="#FFFBF5" stroke-width="2" stroke-linecap="round"/>

  <!-- Left arm holding clipboard -->
  <path d="M132,106 C118,110 108,118 106,126" fill="none" stroke="#1E3A5F" stroke-width="5" stroke-linecap="round"/>
  <circle cx="105" cy="127" r="5" fill="#FBBF24"/>

  <!-- Clipboard/calendar being held -->
  <g transform="translate(78, 108)">
    <!-- Clipboard body -->
    <rect x="0" y="0" width="30" height="38" rx="4" fill="#FFFBF5" stroke="#F97316" stroke-width="1.2" stroke-opacity="0.5"/>
    <!-- Clipboard clip at top -->
    <rect x="9" y="-4" width="12" height="8" rx="3" fill="#F97316"/>
    <!-- Calendar header -->
    <rect x="3" y="6" width="24" height="7" rx="2" fill="#F97316" opacity="0.6"/>
    <!-- Grid lines -->
    <g stroke="#F97316" stroke-width="0.5" opacity="0.25">
      <line x1="5" y1="18" x2="25" y2="18"/>
      <line x1="5" y1="24" x2="25" y2="24"/>
      <line x1="5" y1="30" x2="25" y2="30"/>
    </g>
    <!-- Dots representing dates -->
    <g fill="#1E3A5F" opacity="0.3">
      <circle cx="9" cy="21" r="1.5"/>
      <circle cx="15" cy="21" r="1.5"/>
      <circle cx="21" cy="21" r="1.5"/>
      <circle cx="9" cy="27" r="1.5"/>
      <circle cx="15" cy="27" r="1.5"/>
    </g>
    <!-- Checkmark on one date -->
    <path d="M19,25 L21,28 L25,23" fill="none" stroke="#5EEAD4" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Right arm (thumbs up / waving) -->
  <path d="M168,106 C182,100 190,92 192,86" fill="none" stroke="#1E3A5F" stroke-width="5" stroke-linecap="round"/>
  <circle cx="193" cy="85" r="5" fill="#FBBF24"/>
  <!-- Thumb up gesture -->
  <line x1="193" y1="85" x2="193" y2="78" stroke="#FBBF24" stroke-width="3" stroke-linecap="round"/>

  <!-- Door -->
  <rect x="142" y="142" width="16" height="14" rx="8" fill="#0F2744"/>

  <!-- Feet -->
  <ellipse cx="140" cy="160" rx="10" ry="5" fill="#1E3A5F"/>
  <ellipse cx="160" cy="160" rx="10" ry="5" fill="#1E3A5F"/>
  <ellipse cx="138" cy="159" rx="5" ry="2" fill="#2A4F7A"/>
  <ellipse cx="158" cy="159" rx="5" ry="2" fill="#2A4F7A"/>

  <!-- Sparkles around (excitement!) -->
  <!-- Big sparkle top-right -->
  <g transform="translate(220, 60)">
    <line x1="0" y1="-7" x2="0" y2="7" stroke="#FBBF24" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
    <line x1="-7" y1="0" x2="7" y2="0" stroke="#FBBF24" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
    <line x1="-4.5" y1="-4.5" x2="4.5" y2="4.5" stroke="#FBBF24" stroke-width="1.2" stroke-linecap="round" opacity="0.3"/>
    <line x1="4.5" y1="-4.5" x2="-4.5" y2="4.5" stroke="#FBBF24" stroke-width="1.2" stroke-linecap="round" opacity="0.3"/>
  </g>

  <!-- Medium sparkle left -->
  <g transform="translate(65, 75)">
    <line x1="0" y1="-5" x2="0" y2="5" stroke="#5EEAD4" stroke-width="1.5" stroke-linecap="round" opacity="0.45"/>
    <line x1="-5" y1="0" x2="5" y2="0" stroke="#5EEAD4" stroke-width="1.5" stroke-linecap="round" opacity="0.45"/>
  </g>

  <!-- Small sparkle -->
  <g transform="translate(240, 130)">
    <line x1="0" y1="-4" x2="0" y2="4" stroke="#F97316" stroke-width="1.5" stroke-linecap="round" opacity="0.35"/>
    <line x1="-4" y1="0" x2="4" y2="0" stroke="#F97316" stroke-width="1.5" stroke-linecap="round" opacity="0.35"/>
  </g>

  <!-- Confetti dots -->
  <circle cx="50" cy="45" r="2.5" fill="#F97316" opacity="0.25"/>
  <circle cx="250" cy="40" r="2" fill="#5EEAD4" opacity="0.3"/>
  <circle cx="35" cy="130" r="2" fill="#FBBF24" opacity="0.3"/>
  <circle cx="265" cy="170" r="1.5" fill="#D1FAE5" opacity="0.4"/>
  <circle cx="210" cy="190" r="2" fill="#5EEAD4" opacity="0.2"/>
  <circle cx="80" cy="180" r="1.5" fill="#F97316" opacity="0.2"/>

  <!-- Small stars -->
  <path d="M230, 35 L231.5,39 L236,39 L232.5,42 L233.5,46 L230,43 L226.5,46 L227.5,42 L224,39 L228.5,39 Z" fill="#FBBF24" opacity="0.4"/>
  <path d="M55,160 L56,163 L59,163 L57,165 L57.5,168 L55,166 L52.5,168 L53,165 L51,163 L54,163 Z" fill="#F97316" opacity="0.3"/>

  <!-- Wave decoration at very bottom -->
  <path d="M0,225 Q30,218 60,225 Q90,232 120,225 Q150,218 180,225 Q210,232 240,225 Q270,218 300,225" fill="none" stroke="#5EEAD4" stroke-width="1.5" stroke-linecap="round" opacity="0.25"/>
  <path d="M0,233 Q40,227 80,233 Q120,239 160,233 Q200,227 240,233 Q270,237 300,233" fill="none" stroke="#5EEAD4" stroke-width="1" stroke-linecap="round" opacity="0.15"/>
</svg>