<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Primary gradient for circular badge -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2E3575"/>
      <stop offset="100%" stop-color="#1B2050"/>
    </linearGradient>
    <!-- Golden glow for lamp -->
    <radialGradient id="lampGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FBBF24" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#FBBF24" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#FBBF24" stop-opacity="0"/>
    </radialGradient>
    <!-- Subtle outer glow -->
    <radialGradient id="outerGlow" cx="50%" cy="35%" r="50%">
      <stop offset="0%" stop-color="#FBBF24" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#FBBF24" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Circular badge background -->
  <circle cx="32" cy="32" r="30" fill="url(#bgGrad)" stroke="#242B61" stroke-width="1.5"/>

  <!-- Ambient glow from lamp -->
  <circle cx="32" cy="20" r="16" fill="url(#outerGlow)"/>

  <!-- === LIGHTHOUSE === -->
  <!-- Lighthouse body (tapered trapezoid) -->
  <path d="M26,50 L28,26 L36,26 L38,50 Z" fill="white"/>

  <!-- Orange stripe -->
  <path d="M26.8,40 L27.5,35 L36.5,35 L37.2,40 Z" fill="#E86A24"/>

  <!-- Lighthouse gallery/balcony -->
  <rect x="25.5" y="24" width="13" height="3" rx="0.8" fill="white"/>

  <!-- Lamp housing -->
  <rect x="28" y="19" width="8" height="6" rx="1" fill="white" opacity="0.95"/>

  <!-- Lamp glass / golden light -->
  <rect x="29" y="20" width="6" height="4.5" rx="0.5" fill="#FBBF24"/>

  <!-- Lamp glow effect -->
  <circle cx="32" cy="22" r="6" fill="url(#lampGlow)"/>

  <!-- Lighthouse dome/cap -->
  <path d="M28,19 L32,13 L36,19 Z" fill="white"/>

  <!-- Dome tip / finial -->
  <circle cx="32" cy="12.5" r="1.5" fill="#FBBF24"/>

  <!-- Light rays -->
  <line x1="24" y1="22" x2="18" y2="20" stroke="#FBBF24" stroke-width="0.8" stroke-linecap="round" opacity="0.45"/>
  <line x1="24.5" y1="19" x2="19" y2="15" stroke="#FBBF24" stroke-width="0.7" stroke-linecap="round" opacity="0.3"/>
  <line x1="40" y1="22" x2="46" y2="20" stroke="#FBBF24" stroke-width="0.8" stroke-linecap="round" opacity="0.45"/>
  <line x1="39.5" y1="19" x2="45" y2="15" stroke="#FBBF24" stroke-width="0.7" stroke-linecap="round" opacity="0.3"/>

  <!-- Lighthouse base platform -->
  <rect x="21" y="50" width="22" height="3.5" rx="1.2" fill="white" opacity="0.8"/>

  <!-- Teal accent waves at bottom -->
  <path d="M10,56 Q16,53 22,55 Q28,57 34,55 Q40,53 46,55 Q51,56.5 54,56" stroke="#5EEAD4" stroke-width="1.2" fill="none" stroke-linecap="round" opacity="0.55"/>
</svg>
