<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Anchor ring at top -->
  <circle
    cx="32"
    cy="14"
    r="5"
    stroke="white"
    stroke-width="3"
    fill="none"
  />
  <!-- Anchor vertical shaft -->
  <line
    x1="32"
    y1="19"
    x2="32"
    y2="52"
    stroke="white"
    stroke-width="3"
    stroke-linecap="round"
  />
  <!-- Anchor horizontal bar (crossbar) -->
  <line
    x1="20"
    y1="27"
    x2="44"
    y2="27"
    stroke="white"
    stroke-width="3"
    stroke-linecap="round"
  />
  <!-- Anchor left arm -->
  <path
    d="M32 52 Q20 52 18 44"
    stroke="white"
    stroke-width="3"
    stroke-linecap="round"
    fill="none"
  />
  <!-- Anchor right arm -->
  <path
    d="M32 52 Q44 52 46 44"
    stroke="white"
    stroke-width="3"
    stroke-linecap="round"
    fill="none"
  />
  <!-- Left crossbar tip -->
  <circle cx="20" cy="27" r="2" fill="white" />
  <!-- Right crossbar tip -->
  <circle cx="44" cy="27" r="2" fill="white" />
</svg>
