events {
  worker_connections 1024;
}

http {
  # ── MIME types ──────────────────────────────────────────────────────────────
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  # ── Logging ─────────────────────────────────────────────────────────────────
  access_log /var/log/nginx/access.log;
  error_log  /var/log/nginx/error.log warn;

  # ── Performance ─────────────────────────────────────────────────────────────
  sendfile        on;
  tcp_nopush      on;
  keepalive_timeout 65;
  client_max_body_size 20M;

  # ── Rate Limiting ────────────────────────────────────────────────────────────
  limit_req_zone $binary_remote_addr zone=api_login:10m rate=5r/s;
  limit_req_zone $binary_remote_addr zone=api_general:10m rate=30r/s;

  # ── GZIP ────────────────────────────────────────────────────────────────────
  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_types text/plain text/css application/json application/javascript
             text/xml application/xml text/javascript application/wasm;

  # ── Upstreams ────────────────────────────────────────────────────────────────
  upstream web {
    server web:3000;
    keepalive 8;
  }

  upstream api {
    server api:3001;
    keepalive 8;
  }

  # ── HTTP server — redirect to HTTPS in production ───────────────────────────
  # For local/staging without SSL, remove the redirect and uncomment the proxy blocks.
  server {
    listen 80;
    server_name _;

    # Security headers (safe even on HTTP)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=()" always;

    # Let's Encrypt ACME challenge (Certbot webroot)
    location /.well-known/acme-challenge/ {
      root /var/www/certbot;
    }

    # Redirect all other traffic to HTTPS (comment out if running without SSL)
    location / {
      return 301 https://$host$request_uri;
    }

    # ── Uncomment the blocks below for HTTP-only (no SSL) deployments ─────────
    # location /api/ {
    #   rewrite ^/api/(.*)$ /$1 break;
    #   proxy_pass http://api;
    #   proxy_http_version 1.1;
    #   proxy_set_header Host $host;
    #   proxy_set_header X-Real-IP $remote_addr;
    #   proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #   proxy_set_header X-Forwarded-Proto $scheme;
    #   proxy_set_header Connection "";
    #   proxy_pass_header Set-Cookie;
    #   proxy_cookie_path / /;
    # }
    # location ~* \.(ico|css|js|gif|jpg|jpeg|png|svg|woff|woff2|ttf|eot|webp|avif)$ {
    #   proxy_pass http://web;
    #   proxy_http_version 1.1;
    #   proxy_set_header Host $host;
    #   add_header Cache-Control "public, max-age=2592000, immutable";
    # }
    # location / {
    #   proxy_pass http://web;
    #   proxy_http_version 1.1;
    #   proxy_set_header Host $host;
    #   proxy_set_header X-Real-IP $remote_addr;
    #   proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #   proxy_set_header X-Forwarded-Proto $scheme;
    #   proxy_set_header Upgrade $http_upgrade;
    #   proxy_set_header Connection "upgrade";
    #   proxy_read_timeout 60s;
    # }
  }

  # ── HTTPS server ─────────────────────────────────────────────────────────────
  # Prerequisites: place SSL certs in ./nginx/ssl/
  #   - fullchain.pem  (certificate + intermediate chain)
  #   - privkey.pem    (private key)
  # Use Certbot: certbot certonly --webroot -w /var/www/certbot -d pristav-radosti.cz
  # Then copy: cp /etc/letsencrypt/live/pristav-radosti.cz/*.pem ./nginx/ssl/
  server {
    listen 443 ssl;
    http2 on;
    server_name pristav-radosti.cz www.pristav-radosti.cz;

    # ── TLS ───────────────────────────────────────────────────────────────────
    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # OCSP Stapling
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout 5s;

    # ── Security headers ─────────────────────────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=()" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # ── API login rate limiting ──────────────────────────────────────────────
    location /api/auth/login {
      limit_req zone=api_login burst=10 nodelay;
      rewrite ^/api/(.*)$ /$1 break;
      proxy_pass http://api;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header Connection "";
      proxy_pass_header Set-Cookie;
      proxy_cookie_path / /;
      proxy_cookie_flags ~ secure samesite=strict;
    }

    # ── API proxy (/api/* → api:3001/*) ──────────────────────────────────────
    location /api/ {
      limit_req zone=api_general burst=50 nodelay;
      rewrite ^/api/(.*)$ /$1 break;
      proxy_pass http://api;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header Connection "";
      # Pass cookies through (for httpOnly refresh token)
      proxy_pass_header Set-Cookie;
      proxy_cookie_path / /;
      proxy_cookie_flags ~ secure samesite=strict;
    }

    # ── Static assets — long cache ───────────────────────────────────────────
    location ~* \.(ico|css|js|gif|jpg|jpeg|png|svg|woff|woff2|ttf|eot|webp|avif)$ {
      proxy_pass http://web;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # ── Next.js app (everything else) ────────────────────────────────────────
    location / {
      proxy_pass http://web;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_read_timeout 60s;
    }
  }
}
