# VPS overlay — vyšší limit pro POST /auth/login (E2E, více rolí z jedné veřejné IP).
# Použití (vedle hlavního compose, např. produkce na Contabu):
#   docker compose -f docker-compose.yml -f docker-compose.vps.yml \
#     --env-file .env.production up -d --force-recreate api
#
# Pozn.: docker-compose.staging.yml už stejné limity nastavuje pro HTTP staging.

services:
  api:
    environment:
      AUTH_LOGIN_RATE_LIMIT_MAX: "120"
      AUTH_LOGIN_RATE_LIMIT_WINDOW: "5 minutes"
